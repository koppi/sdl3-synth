name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            apt-packages: devscripts dpkg-dev build-essential git make pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev
          - os: macos-14
            brew-packages: sdl3
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.apt-packages }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake sdl3

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-build
          path: build/sdl3-synth
          retention-days: 7

  deb-package:
    runs-on: ubuntu-24.04
    container: debian:sid
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: |
          apt update
          apt -y install dpkg-dev devscripts
          ln -sf . debian/sdl3-synth
          dpkg-buildpackage -us -uc -b

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: |
            ../sdl3-synth_*.deb
            ../sdl3-synth-dbgsym_*.deb
          retention-days: 14

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, deb-package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Linux-build
          path: linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-build
          path: macos

      - name: Download Debian packages
        uses: actions/download-artifact@v4
        with:
          name: debian-packages
          path: debian

      - name: Prepare artifacts
        run: |
          chmod +x linux/sdl3-synth
          tar -czvf sdl3-synth-linux-x86_64.tar.gz -C linux sdl3-synth
          tar -czvf sdl3-synth-macos.tar.gz -C macos sdl3-synth

      - name: Create checksums
        run: |
          sha256sum sdl3-synth-linux-x86_64.tar.gz > SHA256SUMS
          sha256sum sdl3-synth-macos.tar.gz >> SHA256SUMS
          sha256sum debian/*.deb >> SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sdl3-synth-linux-x86_64.tar.gz
            sdl3-synth-macos.tar.gz
            debian/*.deb
            SHA256SUMS
          generate_release_notes: true
