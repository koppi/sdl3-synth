name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Name of the VST3 bundle that is built and released.
  VST3_BUNDLE: SDL3Synth.vst3

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            generator-args: -G Ninja
            apt-packages: devscripts dpkg-dev build-essential git make pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev
          - name: macOS
            os: macos-14
            generator-args: -G Ninja
            # Build a universal binary so that the plug-in runs on Intel and
            # Apple Silicon Macs. arm64 requires macOS 11 as deployment target.
            cmake-args: '-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"'
            brew-packages: sdl3
          - name: Windows
            os: windows-2022
            # The default Visual Studio generator is used on Windows.
            generator-args: ''
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.apt-packages }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake sdl3

      - name: Configure
        run: >
          cmake -S . -B build ${{ matrix.generator-args }}
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build --config Release

      # The VST3 validator of the SDK runs as a post build step of the plug-in
      # target, so a broken plug-in fails the build here already.

      - name: Package VST3 plug-in (Linux)
        if: runner.os == 'Linux'
        working-directory: build/VST3/Release
        run: tar -czf "$GITHUB_WORKSPACE/sdl3-synth-vst3-linux-x86_64.tar.gz" ${{ env.VST3_BUNDLE }}

      - name: Package VST3 plug-in (macOS)
        if: runner.os == 'macOS'
        run: |
          # Ad-hoc sign the bundle, hosts on Apple Silicon expect a signature.
          codesign --force --verbose --sign - "build/VST3/Release/${{ env.VST3_BUNDLE }}"
          cd build/VST3/Release
          zip -r -y "$GITHUB_WORKSPACE/sdl3-synth-vst3-macos-universal.zip" "${{ env.VST3_BUNDLE }}"

      - name: Package VST3 plug-in (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "build/VST3/Release/${{ env.VST3_BUNDLE }}" -DestinationPath "sdl3-synth-vst3-windows-x86_64.zip"

      - name: Upload VST3 plug-in artifact
        uses: actions/upload-artifact@v6
        with:
          name: vst3-${{ matrix.name }}
          path: |
            sdl3-synth-vst3-*.zip
            sdl3-synth-vst3-*.tar.gz
          retention-days: 7

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}-build
          path: build/sdl3-synth
          retention-days: 7

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}-build
          path: |
            build/Release/sdl3-synth.exe
            build/Release/*.dll
          retention-days: 7

  deb-package:
    runs-on: ubuntu-24.04
    container: debian:sid
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Build package
        run: |
          apt update
          apt -y install devscripts dpkg-dev build-essential git make pkg-config cmake ninja-build libasound2-dev libpulse-dev libsndio-dev libx11-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev
          dpkg-buildpackage -us -uc -b

      - name: Copy .deb packages to workspace
        run: |
          cp ../sdl3-synth_*.deb .
          cp ../sdl3-synth-dbgsym_*.deb .

      - name: Upload .deb packages
        uses: actions/upload-artifact@v6
        with:
          name: debian-packages
          path: |
            sdl3-synth_*.deb
            sdl3-synth-dbgsym_*.deb
          retention-days: 14

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, deb-package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download Linux artifact
        uses: actions/download-artifact@v6
        with:
          name: Linux-build
          path: linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v6
        with:
          name: macOS-build
          path: macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v6
        with:
          name: Windows-build
          path: windows

      - name: Download VST3 plug-in artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: vst3-*
          path: vst3
          merge-multiple: true

      - name: Download Debian packages
        uses: actions/download-artifact@v6
        with:
          name: debian-packages
          path: debian

      - name: Prepare artifacts
        run: |
          chmod +x linux/sdl3-synth
          tar -czvf sdl3-synth-linux-x86_64.tar.gz -C linux sdl3-synth
          tar -czvf sdl3-synth-macos.tar.gz -C macos sdl3-synth
          (cd windows && zip -r ../sdl3-synth-windows-x86_64.zip .)

      - name: Create checksums
        run: |
          sha256sum sdl3-synth-linux-x86_64.tar.gz > SHA256SUMS
          sha256sum sdl3-synth-macos.tar.gz >> SHA256SUMS
          sha256sum sdl3-synth-windows-x86_64.zip >> SHA256SUMS
          sha256sum vst3/* >> SHA256SUMS
          sha256sum debian/*.deb >> SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sdl3-synth-linux-x86_64.tar.gz
            sdl3-synth-macos.tar.gz
            sdl3-synth-windows-x86_64.zip
            vst3/*
            debian/*.deb
            SHA256SUMS
          generate_release_notes: true
